# XcodeGen spec — source of truth for iBoard.xcodeproj (`xcodegen generate`). See ROADMAP D-28.
name: iBoard
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
options:
  bundleIdPrefix: app
  deploymentTarget: { iOS: "27.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  IBoardCore: { path: Packages/IBoardCore }
  IBoardLayout: { path: Packages/IBoardLayout }
  IBoardEngine: { path: Packages/IBoardEngine }
  IBoardOTP: { path: Packages/IBoardOTP }
  IBoardEmoji: { path: Packages/IBoardEmoji }
  IBoardTheme: { path: Packages/IBoardTheme }
  IBoardUI: { path: Packages/IBoardUI }
  IBoardSync: { path: Packages/IBoardSync }
  IBoardPersonalSync: { path: Packages/IBoardPersonalSync }
targets:
  iBoard:
    type: application
    platform: iOS
    sources: [iBoard]
    dependencies:
      - target: iBoardKeyboard
      - package: IBoardCore
      - package: IBoardEngine
      - package: IBoardTheme
      - package: IBoardOTP
      - package: IBoardSync
      - package: IBoardPersonalSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IBOARD_BUNDLE_PREFIX)
        CODE_SIGN_ENTITLEMENTS: iBoard/iBoard.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iBoard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  iBoardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - iBoardKeyboard
      # English lexicon + 3-gram LM (M2-01, SCOWL + Leipzig news, docs/ENGLISH_DATA.md): <bundle>/english/, mmap'd lazily.
      - path: Data/english/lexicon.iblex
        buildPhase: { copyFiles: { destination: resources, subpath: english } }
      - path: Data/english/lm.iblm
        buildPhase: { copyFiles: { destination: resources, subpath: english } }
      # Hinglish lexicon + LM (M7-01, CC BY-SA 4.0 data): copied to <bundle>/hinglish/ because the file names
      # collide with the English ones; mmap'd lazily by EngineHost.
      - path: Data/hinglish/lexicon.iblex
        buildPhase: { copyFiles: { destination: resources, subpath: hinglish } }
      - path: Data/hinglish/lm.iblm
        buildPhase: { copyFiles: { destination: resources, subpath: hinglish } }
    dependencies:
      - package: IBoardCore
      - package: IBoardLayout
      - package: IBoardEngine
      - package: IBoardOTP
      - package: IBoardEmoji
      - package: IBoardTheme
      - package: IBoardUI
    info:
      path: iBoardKeyboard/Info.plist
      properties:
        CFBundleDisplayName: iBoard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(IBOARD_BUNDLE_PREFIX).keyboard
        CODE_SIGN_ENTITLEMENTS: iBoardKeyboard/iBoardKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  iBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iBoardTests]
    dependencies: [{ target: iBoard }]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: $(IBOARD_BUNDLE_PREFIX)Tests, GENERATE_INFOPLIST_FILE: YES }
  iBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iBoardUITests]
    dependencies: [{ target: iBoard }]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: $(IBOARD_BUNDLE_PREFIX)UITests, GENERATE_INFOPLIST_FILE: YES }
schemes:
  iBoard:
    build:
      targets: { iBoard: all, iBoardKeyboard: all }
    test:
      targets: [iBoardTests, iBoardUITests]
